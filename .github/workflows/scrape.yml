name: Scrape Berita Instagram

on:
  # Jadwal otomatis: setiap hari jam 6 pagi UTC (13:00 WIB)
  schedule:
    - cron: '0 6 * * *'

  # Bisa dijalankan manual dari tab Actions
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # agar bisa push hasil scraping

    steps:
      # 1. Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install dependency
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Jalankan scraper
      - name: Run scraper
        run: python scraper.py

      # 5. Commit & push hasil scraping
      - name: Commit hasil scraping
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add berita.json
          git diff --staged --quiet || git commit -m "Update berita.json [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
