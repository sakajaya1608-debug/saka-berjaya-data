name: Scrape Berita Instagram

on:
  schedule:
    - cron: '0 6 * * *'  # Setiap hari jam 6 pagi UTC (13:00 WIB)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          IG_LOGIN_USER: ${{ secrets.IG_LOGIN_USER }}
          IG_LOGIN_PASS: ${{ secrets.IG_LOGIN_PASS }}
        run: python scraper.py

      - name: Commit hasil scraping
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add berita.json
          git diff --staged --quiet || git commit -m "Update berita.json [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
